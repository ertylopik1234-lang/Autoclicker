name: Build Auto Clicker

on:
  workflow_dispatch:

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64

      - name: Upload GEODE
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
